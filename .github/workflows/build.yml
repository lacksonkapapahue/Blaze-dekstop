name: build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  issues: write
env:
  WAILS: github.com/wailsapp/wails/v2/cmd/wails@v2.16.0

jobs:
  shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Screenshot the UI
        run: |
          pip install -q playwright && python -m playwright install --with-deps chromium
          python ci/shots.py
      - name: Push screenshots to the shots branch
        run: |
          cd shots
          git init -q && git checkout -q -b shots
          git -c user.name=ci -c user.email=ci@blaze add -A
          git -c user.name=ci -c user.email=ci@blaze commit -qm "UI shots ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" shots

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.23' }
      - name: Build
        shell: bash
        run: |
          exec > >(tee -a build.log) 2>&1
          choco install nsis -y --no-progress
          export PATH="$PATH:/c/Program Files (x86)/NSIS"
          go install $WAILS
          V=$(cat VERSION)
          wails build -platform windows/amd64 -nsis -ldflags "-X main.version=v$V"
          mkdir dist
          cp build/bin/Blaze.exe dist/Blaze-v$V-windows-amd64-portable.exe
          cp build/bin/*installer*.exe dist/Blaze-v$V-windows-amd64-setup.exe
          ls -l dist
      - name: Report the error
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          { echo "### ${{ github.job }} failed on ${GITHUB_SHA::7}"; echo '```'; tail -n 70 build.log; echo '```'; } > tail.md
          gh issue create -R ${{ github.repository }} --title "CI ${{ github.job }} failed ${GITHUB_SHA::7}" --body-file tail.md
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: dist/ }

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.23' }
      - name: Build
        shell: bash
        run: |
          exec > >(tee -a build.log) 2>&1
          go install $WAILS
          V=$(cat VERSION)
          wails build -platform darwin/universal -ldflags "-X main.version=v$V"
          mkdir -p dist dmg
          cp -R build/bin/Blaze.app dmg/
          ln -s /Applications dmg/Applications
          for i in 1 2 3 4 5; do hdiutil create -volname Blaze -srcfolder dmg -ov -format UDZO dist/Blaze-v$V-macos-universal.dmg && break; sleep 5; done
          test -f dist/Blaze-v$V-macos-universal.dmg
          ls -l dist
      - name: Report the error
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          { echo "### ${{ github.job }} failed on ${GITHUB_SHA::7}"; echo '```'; tail -n 70 build.log; echo '```'; } > tail.md
          gh issue create -R ${{ github.repository }} --title "CI ${{ github.job }} failed ${GITHUB_SHA::7}" --body-file tail.md
      - uses: actions/upload-artifact@v4
        with: { name: macos, path: dist/ }

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.23' }
      - name: Build
        shell: bash
        run: |
          exec > >(tee -a build.log) 2>&1
          sudo apt-get update -q && sudo apt-get install -yq libgtk-3-dev libwebkit2gtk-4.1-dev
          go install $WAILS
          V=$(cat VERSION)
          wails build -platform linux/amd64 -tags webkit2_41 -ldflags "-X main.version=v$V"
          mkdir -p dist pkg/usr/bin pkg/usr/share/applications pkg/usr/share/icons/hicolor/512x512/apps pkg/DEBIAN
          cp build/bin/Blaze pkg/usr/bin/blaze-desktop
          cp packaging/linux/blaze.desktop pkg/usr/share/applications/
          cp build/appicon.png pkg/usr/share/icons/hicolor/512x512/apps/blaze.png
          printf 'Package: blaze-desktop\nVersion: %s\nArchitecture: amd64\nMaintainer: Lackson Kapapa <kapapaluckson75@gmail.com>\nDepends: libgtk-3-0, libwebkit2gtk-4.1-0\nDescription: Blaze assistant for your computer\n' "$V" > pkg/DEBIAN/control
          dpkg-deb --build --root-owner-group pkg dist/blaze-desktop_${V}_amd64.deb
          mkdir tarball && cp build/bin/Blaze tarball/blaze-desktop && cp packaging/linux/blaze.desktop build/appicon.png tarball/
          tar -czf dist/Blaze-v$V-linux-amd64.tar.gz -C tarball .
          cp build/bin/Blaze blaze-desktop-bin
          ls -l dist
      - name: Report the error
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          { echo "### ${{ github.job }} failed on ${GITHUB_SHA::7}"; echo '```'; tail -n 70 build.log; echo '```'; } > tail.md
          gh issue create -R ${{ github.repository }} --title "CI ${{ github.job }} failed ${GITHUB_SHA::7}" --body-file tail.md
      - uses: actions/upload-artifact@v4
        with: { name: linux, path: dist/ }
      - uses: actions/upload-artifact@v4
        with: { name: linux-bin, path: blaze-desktop-bin }

  arch:
    needs: linux
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: linux-bin }
      - name: Package for Arch
        run: |
          pacman -Syu --noconfirm --needed base-devel
          useradd -m b
          V=$(cat VERSION)
          mkdir /tmp/pkg && cp packaging/arch/PKGBUILD packaging/linux/blaze.desktop build/appicon.png /tmp/pkg/
          cp blaze-desktop-bin /tmp/pkg/blaze-desktop && chmod +x /tmp/pkg/blaze-desktop
          chown -R b /tmp/pkg
          su b -c "cd /tmp/pkg && BLAZE_VERSION=$V makepkg -f --nodeps"
          mkdir dist && cp /tmp/pkg/*.pkg.tar.zst dist/
          ls -l dist
      - uses: actions/upload-artifact@v4
        with: { name: arch, path: dist/ }

  release:
    needs: [windows, macos, linux, arch]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: art }
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V=v$(cat VERSION)
          mkdir rel && find art -type f ! -name 'blaze-desktop-bin' -exec cp {} rel/ \;
          ls -l rel
          gh release delete "$V" -y --cleanup-tag 2>/dev/null || true
          gh release create "$V" rel/* --title "Blaze Desktop $V" --notes "Windows: setup.exe (or portable). macOS: .dmg (right-click > Open the first time). Linux: .deb, Arch .pkg.tar.zst, or tar.gz." --latest

  report:
    if: failure()
    needs: [shots, windows, macos, linux, arch, release]
    runs-on: ubuntu-latest
    steps:
      - name: Note the failure in issue 1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          body="CI failed on ${GITHUB_SHA::7}: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          shots=${{ needs.shots.result }} windows=${{ needs.windows.result }} macos=${{ needs.macos.result }} linux=${{ needs.linux.result }} arch=${{ needs.arch.result }} release=${{ needs.release.result }}"
          gh issue edit 1 -R ${{ github.repository }} --body "$body" 2>/dev/null || gh issue create -R ${{ github.repository }} --title "CI status" --body "$body"
