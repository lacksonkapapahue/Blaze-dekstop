<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Blaze</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <aside id="side">
    <div class="brand" style="--wails-draggable:drag">
      <img class="logo" src="logo.svg" alt=""><span class="bname">Blaze</span><span class="ver" id="ver"></span>
    </div>
    <button id="newChat" class="btn" title="New chat (Ctrl+N)"><svg class="i" viewBox="0 0 16 16"><path d="M8 3v10M3 8h10"/></svg><span>New chat</span><span class="kbd">Ctrl N</span></button>
    <div class="sect"><span class="label">Projects</span><button id="newProject" class="mini" title="New project"><svg class="i sm" viewBox="0 0 16 16"><path d="M8 3v10M3 8h10"/></svg></button></div>
    <nav id="projects"></nav>
    <div class="sect"><span class="label" id="chatsLabel">Chats</span><span class="ctx" id="chatsCtx"></span></div>
    <nav id="chats"></nav>
    <div class="sidefoot">
      <button class="nav" data-view="jobs"><svg class="i" viewBox="0 0 16 16"><path d="M2.5 4.5h11M2.5 8h11M2.5 11.5h7"/></svg><span>Jobs</span><span id="jobCount" class="count"></span></button>
      <button class="nav" data-view="schedule"><svg class="i" viewBox="0 0 16 16"><rect x="2.5" y="3.5" width="11" height="10"/><path d="M2.5 6.5h11M5.5 2v3M10.5 2v3"/></svg><span>Schedule</span></button>
      <button class="nav" data-view="connectors"><svg class="i" viewBox="0 0 16 16"><path d="M5.5 2v3.5M10.5 2v3.5M3.5 5.5h9V8a4.5 4.5 0 0 1-9 0zM8 12.5v2"/></svg><span>Connectors</span><span id="connCount" class="count"></span></button>
      <button class="nav" data-view="doctor"><svg class="i" viewBox="0 0 16 16"><path d="M1.5 8.5h3l2-4 3 7 2-3h3"/></svg><span>Doctor</span></button>
      <button class="nav" data-view="settings"><svg class="i" viewBox="0 0 16 16"><path d="M2.5 4.5h6M11.5 4.5h2M2.5 11.5h2M7.5 11.5h6"/><rect x="8.5" y="3" width="3" height="3"/><rect x="4.5" y="10" width="3" height="3"/></svg><span>Settings</span><span id="updCount" class="count"></span></button>
    </div>
  </aside>
  <main id="main">
    <header id="top" style="--wails-draggable:drag">
      <div id="tabs" class="tabs">
        <button data-tab="work" class="on"><svg class="i sm" viewBox="0 0 16 16"><path d="M5 4.5 1.5 8 5 11.5M11 4.5 14.5 8 11 11.5"/></svg>Work</button><button data-tab="design"><svg class="i sm" viewBox="0 0 16 16"><rect x="2" y="2.5" width="12" height="11"/><path d="M2 5.5h12"/></svg>Design<span id="designDot"></span></button>
      </div>
      <button id="folder" class="chip" title="Change folder"><svg class="i sm" viewBox="0 0 16 16"><path d="M1.5 3.5h5l1.5 1.5h6.5v8h-13z"/></svg><span id="folderName"></span></button>
      <span class="grow"></span>
      <button id="route" class="chip" title="Choose the model"><span class="dot" id="routeDot"></span><span id="routeText">No model</span><svg class="i sm caret" viewBox="0 0 16 16"><path d="m4.5 6.5 3.5 3.5 3.5-3.5"/></svg></button>
    </header>
    <section id="view"></section>
  </main>
</div>
<script src="md.js"></script>
<script src="app.js"></script>
<script src="connectors.js"></script>
</body>
</html>
