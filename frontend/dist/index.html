<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Blaze</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <aside id="side">
    <div class="brand" style="--wails-draggable:drag">
      <img class="logo" src="logo.svg" alt=""><span class="label ink">BLAZE</span>
    </div>
    <button id="newChat" class="btn line full"><span class="plus">+</span> New chat</button>
    <div class="sect sectrow"><span class="label">Projects</span><button id="newProject" class="mini" title="New project">+</button></div>
    <nav id="projects"></nav>
    <div class="sect"><span class="label" id="chatsLabel">Chats</span></div>
    <nav id="chats"></nav>
    <div class="sidefoot">
      <button class="nav" data-view="jobs"><span class="label">Jobs</span><span id="jobCount" class="count"></span></button>
      <button class="nav" data-view="schedule"><span class="label">Schedule</span></button>
      <button class="nav" data-view="doctor"><span class="label">Doctor</span></button>
      <button class="nav" data-view="settings"><span class="label">Settings</span></button>
    </div>
  </aside>
  <main id="main">
    <header id="top" style="--wails-draggable:drag">
      <div id="tabs" class="tabs">
        <button data-tab="work" class="on">Work</button><button data-tab="design">Design<span id="designDot"></span></button>
      </div>
      <button id="folder" class="chip" title="Change folder"><span class="dot"></span><span id="folderName"></span></button>
      <span class="grow"></span>
      <button id="route" class="chip ghostchip" title="Switch model"></button>
    </header>
    <section id="view"></section>
  </main>
</div>
<script src="md.js"></script>
<script src="app.js"></script>
</body>
</html>
